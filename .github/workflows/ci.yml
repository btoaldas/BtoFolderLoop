name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Public source check
        run: python3 scripts/check-public.py
      - name: Unit and integration tests
        run: swift test
      - name: Build application
        run: bash scripts/build-app.sh
